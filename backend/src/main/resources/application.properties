spring.application.name=LifeLink
server.port=8080

# Database Configuration (PostgreSQL + PostGIS)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lifelink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate JPA Spatial
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Data Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Security Configuration
lifelink.jwt.secret=${LIFELINK_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
lifelink.jwt.expiration-ms=${LIFELINK_JWT_EXPIRATION:86400000}
