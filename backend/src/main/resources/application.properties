spring.application.name=LifeLink
server.port=8080

# Database Configuration (PostgreSQL when provided, H2 embedded file mode for standalone run)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lifelinkdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate JPA Spatial
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Data Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT Security Configuration
lifelink.jwt.secret=${LIFELINK_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
lifelink.jwt.expiration-ms=${LIFELINK_JWT_EXPIRATION:86400000}
